// Kamputa Browser: trusted, local application chrome bootstrap.
try {
  const Services = globalThis.Services;
  // Native pages and Kamputa UI share Russian by default. Preserve explicit user choices.
  if (!Services.prefs.prefHasUserValue("intl.locale.requested"))
    Services.prefs.setStringPref("intl.locale.requested", "ru");
  const root = Services.dirsvc.get("GreD", Ci.nsIFile);
  root.append("kamputa");
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("kamputa", Services.io.newFileURI(root));
  ChromeUtils.importESModule("resource://kamputa/ui.sys.mjs");
  const scope = { Services, ChromeUtils, Components, Cc, Ci, Cu };
  Services.scriptloader.loadSubScript("resource://kamputa/pages.js", scope, "UTF-8");
  Services.scriptloader.loadSubScript("resource://kamputa/browser.js", scope, "UTF-8");
} catch (error) { Components.utils.reportError("Kamputa bootstrap: " + error.stack); }
